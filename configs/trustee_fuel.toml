# TRUSTEE synthetic driving data, instantaneous fuel consumption per second.
base_config = "quickstart.toml"

[input]
path = "../data/raw/DrivingDataPOC.csv"
format = "csv"
dataset = "trustee-fuel_consumption"
value_column = 7
header = true
quantity_label = "fuel consumption"
unit_label = "mg/s"

[quantization]
digits = 1

[thresholds]
mode = "linear"
min = 0.0
max = 2000.0
step = 0.5

[algorithm]
oracle_checks = 3

[limits]
max_ram_gb = 16.0
max_naive_work = 1e12

[output]
format = "arrow"
