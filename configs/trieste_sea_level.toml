# Trieste hourly sea level, percentage fluctuations about a 708-hour trailing mean, pruned.
base_config = "quickstart.toml"

[input]
path = "../data/raw/sealevelTrieste.csv"
format = "csv"
dataset = "trieste-sea_level"
value_column = 3
header = true
quantity_label = "sea level"
unit_label = "cm"

[preprocessing]
steps = [
  { op = "round", digits = 1 },
  { op = "trailing_mean_fluctuations", window = 708, denominator = "mean", offset = "auto" },
  { op = "clip_extremes", fraction = 0.004, digits = 1 },
]

[quantization]
digits = 1

[thresholds]
mode = "linear"
min = 0.0
max = 100.0
step = 0.5

[algorithm]
reference_checks = 3

[limits]
max_ram_gb = 16.0
max_reference_work = 1e12

[output]
format = "arrow"
