# Geisenheim hourly wind speed (Meteostat), raw series, thresholds 0 to 50 km/h.
base_config = "quickstart.toml"

[input]
path = "../data/raw/meteostatGeisenheim.csv"
format = "csv"
dataset = "geisenheim-wind_speed"
value_column = 9
header = false
quantity_label = "wind speed"
unit_label = "km/h"

[quantization]
digits = 1

[thresholds]
mode = "linear"
min = 0.0
max = 50.0
step = 0.1

[algorithm]
oracle_checks = 3

[limits]
max_ram_gb = 16.0
max_naive_work = 1e12

[output]
format = "arrow"
