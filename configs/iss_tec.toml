# Ionospheric total electron content over Romania, one value every 15 minutes.
base_config = "quickstart.toml"

[input]
path = "../data/raw/spaceWeather.csv"
format = "csv"
dataset = "iss-ionospheric_tec"
value_column = 3
header = true
quantity_label = "total electron content"
unit_label = "TECU"

[quantization]
digits = 1

[thresholds]
mode = "linear"
min = 0.0
max = 23.0
step = 0.1

[algorithm]
oracle_checks = 3

[output]
format = "arrow"
