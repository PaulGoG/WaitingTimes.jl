# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "julia"
    directories:
      - "/"
      - "/docs"
      - "/test"
      - "/test/device"
      - "/bench"
      - "/scripts"
      - "/examples"
    schedule:
      interval: "weekly"
    # JET releases follow the Julia minor versions; the test environment
    # resolves it unconstrained. The producers of the examples are pinned to
    # commits and moved by hand.
    ignore:
      - dependency-name: "JET"
      - dependency-name: "DeepSpaceTelemetry"
      - dependency-name: "MarketTickStreamer"
    groups:
      julia-dependencies:
        patterns:
          - "*"
